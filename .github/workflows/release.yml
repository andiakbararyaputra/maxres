name: Release

# Builds installers for Windows, macOS, and Linux whenever a version tag
# (e.g. v0.1.0) is pushed, then publishes them to a GitHub Release.
# This is how MaxRes ships cross-platform without owning every OS.

on:
  push:
    tags:
      - "v*"

# Needed so tauri-action can create the release and upload installers.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS targets so the Intel/arm matrix rows can cross-build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test && npm run lint

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MaxRes ${{ github.ref_name }}"
          releaseBody: "Free, offline AI image upscaler. See the note in the README about unsigned-app security warnings on first launch."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
