[package]
name = "maxres"
version = "0.1.0"
description = "MaxRes — free, offline AI image upscaler"
authors = ["MaxRes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maxres_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2.3.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Smaller, faster release binaries (standard Tauri size recipe).
[profile.release]
opt-level = "s"   # optimize for size
lto = true         # link-time optimization: strips dead code across crates
codegen-units = 1  # better optimization at the cost of compile time
panic = "abort"    # no unwinding tables
strip = true       # remove debug symbols from the final binary

